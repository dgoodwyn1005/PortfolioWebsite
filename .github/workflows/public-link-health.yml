name: Public link health
on:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27564c9af683 
      - run: node scripts/check-public-links.mjs
