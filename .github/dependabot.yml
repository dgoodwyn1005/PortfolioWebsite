version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    allow:
      - dependency-name: "next"
      - dependency-name: "eslint-config-next"
      - dependency-name: "react"
      - dependency-name: "react-dom"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      framework:
        patterns:
          - "next"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
